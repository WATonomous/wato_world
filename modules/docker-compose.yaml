# Base compose stack — every component as a profile-gated service.
# Stacked with docker-compose.gpu.yaml (GPU components on GPU hosts) and
# docker-compose.dev.yaml (when component:dev).
#
# Per-component shape mirrors wato_monorepo/modules/docker-compose.yaml:
#   <comp>_source       — builds <comp>.Dockerfile target=source           (profile: <comp>_pre)
#   <comp>_deps         — builds <comp>.Dockerfile target=dependencies     (profile: <comp>_pre)
#   <comp>              — builds template.Dockerfile target=deploy with
#                         MODULE_SOURCE / MODULE_DEPS pointing at the two
#                         pre-built layers above.                          (profile: <comp>)
#
# `watod build` activates the _pre profiles first so the source/deps images
# exist locally by the time the runtime stage's FROM ${MODULE_SOURCE} resolves.

services:
  # =====================================================================
  # ingest
  # =====================================================================
  ingest_source:
    profiles: ["ingest_pre"]
    build:
      context: ..
      dockerfile: docker/ingest.Dockerfile
      target: source
      cache_from:
        - "${INGEST_IMAGE}:source_${TAG}"
    image: "${INGEST_IMAGE}:source_${TAG}"

  ingest_deps:
    profiles: ["ingest_pre"]
    build:
      context: ..
      dockerfile: docker/ingest.Dockerfile
      target: dependencies
      cache_from:
        - "${INGEST_IMAGE}:deps_${TAG}"
    image: "${INGEST_IMAGE}:deps_${TAG}"

  ingest:
    profiles: ["ingest"]
    init: true
    user: "${SETUID}:${SETGID}"
    build:
      context: ..
      dockerfile: docker/template.Dockerfile
      target: deploy
      args:
        MODULE_SOURCE: "${INGEST_IMAGE}:source_${TAG}"
        MODULE_DEPS: "${INGEST_IMAGE}:deps_${TAG}"
        COMPONENT_PACKAGE_DIR: ingest
        COMPONENT_PACKAGE: wato_ingest
      cache_from:
        - "${INGEST_IMAGE}:${TAG}"
    image: "${INGEST_IMAGE}:${TAG}"
    environment:
      - ARTIFACT_ROOT_URI=${ARTIFACT_ROOT_URI}
      - BAG_ROOT=${BAG_ROOT}
    volumes:
      - ${WATO_WORLD_DIR}/data/bags:/data/bags:ro
      - ${WATO_WORLD_DIR}/data/artifacts:/data/artifacts
      - ${WATO_WORLD_DIR}/config:/config:ro

  # =====================================================================
  # perception_2d
  # =====================================================================
  perception_2d_source:
