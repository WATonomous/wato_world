# Base compose stack — every component as a profile-gated service.
# Stacked with docker-compose.gpu.yaml (GPU components on GPU hosts) and
# docker-compose.dev.yaml (when component:dev).
#
# Per-component shape mirrors wato_monorepo/modules/docker-compose.yaml:
#   <comp>_source       — builds <comp>.Dockerfile target=source           (profile: <comp>_pre)
#   <comp>_deps         — builds <comp>.Dockerfile target=dependencies     (profile: <comp>_pre)
#   <comp>              — builds template.Dockerfile target=deploy with
#                         MODULE_SOURCE / MODULE_DEPS pointing at the two
#                         pre-built layers above.                          (profile: <comp>)
#
# `watod build` activates the _pre profiles first so the source/deps images
# exist locally by the time the runtime stage's FROM ${MODULE_SOURCE} resolves.

services:
  # =====================================================================
  # ingest
  # =====================================================================
  ingest_source:
    profiles: ["ingest_pre"]
    build:
      context: ..
      dockerfile: docker/ingest.Dockerfile
      target: source
      cache_from:
        - "${INGEST_IMAGE}:source_${TAG}"
    image: "${INGEST_IMAGE}:source_${TAG}"

  ingest_deps:
    profiles: ["ingest_pre"]
    build:
      context: ..
      dockerfile: docker/ingest.Dockerfile
      target: dependencies
      cache_from:
        - "${INGEST_IMAGE}:deps_${TAG}"
    image: "${INGEST_IMAGE}:deps_${TAG}"

  ingest:
    profiles: ["ingest"]
    init: true
    user: "${SETUID}:${SETGID}"
    build:
      context: ..
      dockerfile: docker/template.Dockerfile
      target: deploy
      args:
        MODULE_SOURCE: "${INGEST_IMAGE}:source_${TAG}"
        MODULE_DEPS: "${INGEST_IMAGE}:deps_${TAG}"
        COMPONENT_PACKAGE_DIR: ingest
        COMPONENT_PACKAGE: wato_ingest
      cache_from:
        - "${INGEST_IMAGE}:${TAG}"
    image: "${INGEST_IMAGE}:${TAG}"
    environment:
      - ARTIFACT_ROOT_URI=${ARTIFACT_ROOT_URI}
      - BAG_ROOT=${BAG_ROOT}
    volumes:
      - ${WATO_WORLD_DIR}/data/bags:/data/bags:ro
      - ${WATO_WORLD_DIR}/data/artifacts:/data/artifacts
      - ${WATO_WORLD_DIR}/config:/config:ro

  # =====================================================================
  # perception_2d
  # =====================================================================
  perception_2d_source:
    profiles: ["perception_2d_pre"]
    build:
      context: ..
      dockerfile: docker/perception_2d.Dockerfile
      target: source
      cache_from:
        - "${PERCEPTION_2D_IMAGE}:source_${TAG}"
    image: "${PERCEPTION_2D_IMAGE}:source_${TAG}"

  perception_2d_deps:
    profiles: ["perception_2d_pre"]
    build:
      context: ..
      dockerfile: docker/perception_2d.Dockerfile
      target: dependencies
      cache_from:
        - "${PERCEPTION_2D_IMAGE}:deps_${TAG}"
    image: "${PERCEPTION_2D_IMAGE}:deps_${TAG}"

  perception_2d:
    profiles: ["perception_2d"]
    init: true
    user: "${SETUID}:${SETGID}"
    build:
      context: ..
      dockerfile: docker/template.Dockerfile
      target: deploy
      args:
        MODULE_SOURCE: "${PERCEPTION_2D_IMAGE}:source_${TAG}"
        MODULE_DEPS: "${PERCEPTION_2D_IMAGE}:deps_${TAG}"
        COMPONENT_PACKAGE_DIR: perception_2d
        COMPONENT_PACKAGE: wato_perception_2d
      cache_from:
        - "${PERCEPTION_2D_IMAGE}:${TAG}"
    image: "${PERCEPTION_2D_IMAGE}:${TAG}"
    environment:
      - ARTIFACT_ROOT_URI=${ARTIFACT_ROOT_URI}
      - MODELS_ROOT=${MODELS_ROOT}
      # Point HuggingFace + torch.hub at the pre-fetched models tree
      # (populated on the host by src/perception_2d/scripts/fetch_models.py).
      - HF_HOME=/data/models/hf
      - TORCH_HOME=/data/models/torch_hub
      # Weights are pre-fetched and the mount is read-only, so default to fully
      # offline (no hub contact, no `.no_exist` cache writes). trust_remote_code
      # models (Florence-2) still need a writable scratch dir for their module
      # code — the :ro weights mount can't hold it, so send it to /tmp.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - HF_MODULES_CACHE=/tmp/hf_modules
      # Let the CUDA caching allocator grow/shrink segments instead of holding
      # fixed reserved blocks. SAM 3.1 long-video propagation fragments VRAM
      # (small allocs fail while hundreds of MB sit reserved-but-unallocated);
      # expandable_segments reclaims that headroom. Must be set before torch
      # initialises CUDA, so it lives here rather than in Python.
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    volumes:
      - ${WATO_WORLD_DIR}/data/artifacts:/data/artifacts
      - ${WATO_WORLD_DIR}/data/models:/data/models:ro
      - ${WATO_WORLD_DIR}/config:/config:ro

