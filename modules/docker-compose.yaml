# Base compose stack — every component as a profile-gated service.
# Stacked with docker-compose.infra.yaml, docker-compose.gpu.yaml (GPU components
# on GPU hosts), and docker-compose.dev.yaml (when component:dev).

services:
  # ---------------------------------------------------------------------
  ingest:
    profiles: ["ingest"]
    init: true
    build:
      context: ..
      dockerfile: docker/ingest.Dockerfile
      target: deploy
    image: "${INGEST_IMAGE}:${TAG}"
    environment:
      - ARTIFACT_ROOT_URI=${ARTIFACT_ROOT_URI}
      - BAG_ROOT=${BAG_ROOT}
    volumes:
      - ${WATO_WORLD_DIR}/data/bags:/data/bags:ro
      - ${WATO_WORLD_DIR}/data/artifacts:/data/artifacts
      - ${WATO_WORLD_DIR}/config:/config:ro

  # ---------------------------------------------------------------------
  perception_2d:
    profiles: ["perception_2d"]
    init: true
    build:
      context: ..
      dockerfile: docker/perception_2d.Dockerfile
