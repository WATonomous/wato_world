    image: "${PERCEPTION_2D_IMAGE}:deps_${TAG}"

  perception_2d:
    profiles: ["perception_2d"]
    init: true
    user: "${SETUID}:${SETGID}"
    build:
      context: ..
      dockerfile: docker/template.Dockerfile
      target: deploy
      args:
        MODULE_SOURCE: "${PERCEPTION_2D_IMAGE}:source_${TAG}"
        MODULE_DEPS: "${PERCEPTION_2D_IMAGE}:deps_${TAG}"
        COMPONENT_PACKAGE_DIR: perception_2d
        COMPONENT_PACKAGE: wato_perception_2d
      cache_from:
        - "${PERCEPTION_2D_IMAGE}:${TAG}"
    image: "${PERCEPTION_2D_IMAGE}:${TAG}"
    environment:
      - ARTIFACT_ROOT_URI=${ARTIFACT_ROOT_URI}
      - MODELS_ROOT=${MODELS_ROOT}
    volumes:
      - ${WATO_WORLD_DIR}/data/artifacts:/data/artifacts
      - ${WATO_WORLD_DIR}/data/models:/data/models:ro
      - ${WATO_WORLD_DIR}/config:/config:ro

  # =====================================================================
  # lidar_preprocessing
  # =====================================================================
  lidar_preprocessing_source:
    profiles: ["lidar_preprocessing_pre"]
    build:
      context: ..
      dockerfile: docker/lidar_preprocessing.Dockerfile
      target: source
      cache_from:
        - "${LIDAR_PREPROCESSING_IMAGE}:source_${TAG}"
    image: "${LIDAR_PREPROCESSING_IMAGE}:source_${TAG}"

  lidar_preprocessing_deps:
    profiles: ["lidar_preprocessing_pre"]
    build:
      context: ..
      # Expose the prefetched torch wheels and ML-source clones as named
      # build contexts. The Dockerfile bind-mounts them read-only via
      # `--mount=type=bind,from=<name>` instead of COPYing — keeps the
      # 2.5 GB of CUDA wheels out of both the main build context and the
      # image layer history. See docker/lidar_preprocessing.Dockerfile.
      additional_contexts:
        torch_wheels: ../docker/wheels/torch
        mink_src: ../docker/sources/MinkowskiEngine
        mapmos_src: ../docker/sources/MapMOS
      dockerfile: docker/lidar_preprocessing.Dockerfile
      target: dependencies
      cache_from:
        - "${LIDAR_PREPROCESSING_IMAGE}:deps_${TAG}"
    image: "${LIDAR_PREPROCESSING_IMAGE}:deps_${TAG}"

  lidar_preprocessing:
    profiles: ["lidar_preprocessing"]
    init: true
    user: "${SETUID}:${SETGID}"
    build:
      context: ..
      dockerfile: docker/template.Dockerfile
