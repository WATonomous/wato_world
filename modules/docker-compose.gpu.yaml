# GPU overrides — applied on hosts with nvidia-container-toolkit.
# The watod CLI stacks this only when GPU_AVAILABLE=true and a GPU component
# is active.

services:
  # `extends:` in docker-compose.dev.yaml deep-merges the runtime service def
  # at parse time, BEFORE override files are layered on. So adding the
  # nvidia runtime to e.g. `perception_2d` here does NOT propagate to
  # `perception_2d_dev` — each _dev variant needs its own override entry.
  perception_2d: &gpu-defaults
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  perception_2d_dev: *gpu-defaults

  # lidar_preprocessing runs MapMOS / MinkowskiEngine inference on GPU
  # when cfg.mapmos.enabled. Geometry-only paths don't actually need the
  # GPU but the image is unified, so we always layer in the nvidia
  # runtime when GPU_AVAILABLE=true.
  lidar_preprocessing: *gpu-defaults
  lidar_preprocessing_dev: *gpu-defaults

  proposal_generation: *gpu-defaults
  proposal_generation_dev: *gpu-defaults

  tracking: *gpu-defaults
  tracking_dev: *gpu-defaults

  label_refinement: *gpu-defaults
  label_refinement_dev: *gpu-defaults

  open_vocab_discovery: *gpu-defaults
  open_vocab_discovery_dev: *gpu-defaults

  student_training: *gpu-defaults
  student_training_dev: *gpu-defaults
