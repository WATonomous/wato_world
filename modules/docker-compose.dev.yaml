# Dev overrides — separate <target>_dev services that:
#   - build the develop target (host user mapped, dev tools installed)
#   - bind-mount source for hot reload
#   - command: sleep infinity (you `watod -t <target>_dev` in to work)
#
# Activated by `watod -c perception_2d:dev up`.

services:
  ingest_dev:
    profiles: ["ingest_dev"]
    extends:
      file: docker-compose.yaml
      service: ingest
    build:
      target: develop
      args:
        USERNAME: "${USERNAME}"
        USER_UID: "${SETUID}"
        USER_GID: "${SETGID}"
        CLAUDE_CODE: "${CLAUDE_CODE}"
    image: "${INGEST_IMAGE}:dev_${TAG}"
    command: sleep infinity
    volumes:
      - ${WATO_WORLD_DIR}/src/common:/ws/src/common
      - ${WATO_WORLD_DIR}/src/ingest:/ws/src/ingest
      - ${WATO_WORLD_DIR}/data/bags:/data/bags:ro
      - ${WATO_WORLD_DIR}/data/artifacts:/data/artifacts
      - ${WATO_WORLD_DIR}/config:/config:ro

  perception_2d_dev:
