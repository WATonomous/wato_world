name: build-base-images

on:
  push:
    branches: [main]
    paths:
      - "docker/base/**"
      - ".github/workflows/build_base_images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: cuda
            dockerfile: docker/base/inject_cuda_base.Dockerfile
            tag: cuda-12.4
          - flavor: cpu
            dockerfile: docker/base/inject_cpu_base.Dockerfile
            tag: cpu-ubuntu24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/base:${{ matrix.tag }}
          cache-from: type=gha,scope=base-${{ matrix.flavor }}
          cache-to: type=gha,scope=base-${{ matrix.flavor }},mode=max
