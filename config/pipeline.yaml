# Per-component hyperparameters. Loaded by each component's config.py via Pydantic.
#
# NOTE: each component owns its own YAML inside src/<component>/config/.
# Ingest, for example, lives entirely in src/ingest/config/ingest.yaml.
# This file is kept temporarily for the components that haven't migrated yet.

perception_2d:
  # Legacy single-detector knobs (still honored when `detectors` is empty).
  detector: grounding_dino
  detector_score_threshold: 0.25

  # Optional multi-detector ensemble.  Drop both entries' `enabled: false`
  # to fall back to the legacy single-detector path above.
  detectors:
    - name: grounding_dino
      enabled: true
      score_threshold: 0.25
    - name: yolo_world
      enabled: true
      score_threshold: 0.25
  detector_ensemble_iou: 0.6

  # SAM2 segmentation (existing).
  sam2_checkpoint: sam2_hiera_large
  use_lidar_prompts: true
  lidar_prompt_max_points: 50

  # Depth Anything V2 + LiDAR-aligned metric scale.  See
  # docs/research/depth_anything_guidance.md.
  depth_estimator:
    enabled: true
    model: depth_anything_v2_large
    save_dtype: float16              # fp16 fits a 30s chunk in ~30 GB for 12 cams
    align_to_lidar: true
    min_overlap_pts: 50
    inlier_thresh_m: 0.5

  # DINOv2 ReID embeddings used by tracker_2d + downstream tracking.
  reid_features:
    model: dinov2_vitl14
    every_k_frames: 5

  # 3D radius (m) for clustering cross-camera tracklets into a single
  # global_object_id.
  cross_camera_match_radius_m: 1.5

  upstream_versions:
    ingest: v1

proposal_generation:
  lidar_detectors:
    - centerpoint
    - transfusion_l
  ensemble_iou3d: 0.5
  slf:
    min_lidar_points_for_fit: 5
    min_cameras_for_silhouette: 3
  fusion:
    match_iou3d: 0.3
    match_center_distance_m: 1.5
  upstream_versions:
    ingest: v1
    perception_2d: v1
    lidar_preprocessing: v1

tracking:
  kalman_motion_model:
    car: constant_velocity
    pedestrian: near_static
  birth_frames: 3
  death_frames: 5
  cost_weights:
    iou3d: 1.0
    center_distance: 0.5
    masklet_match: 2.0
    dino_cosine: 1.0
  upstream_versions:
    perception_2d: v1
    proposal_generation: v1

label_refinement:
  mode: bootstrap                   # or "learned"
  silhouette_loss_weight: 1.0
  smoothness_loss_weight: 0.5
  static_speed_threshold_mps: 0.5
  virtual_points:
    grid_resolution_m: 0.2
    occlusion_check: true
  learned:
    transformer_layers: 6
    transformer_heads: 8
    train_min_confidence: 0.85
  upstream_versions:
    perception_2d: v1
    lidar_preprocessing: v1
    tracking: v1

open_vocab_discovery:
  min_mask_area_px: 4000
  min_persistence_frames: 10
  upstream_versions:
    perception_2d: v1
    lidar_preprocessing: v1

student_training:
  architecture: bevfusion
  train:
    batch_size: 8
    optimizer: adamw
    lr: 1.0e-4
    epochs: 24
  data:
    min_track_confidence: 0.85
    holdout_bags: ["bag_eval_001", "bag_eval_002"]
  upstream_versions:
    label_refinement: v1
