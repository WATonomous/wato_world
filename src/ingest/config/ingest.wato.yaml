# wato_ingest configuration — WATO panoramic-rig recordings.
#
#   ./watod run ingest /data/bags/<wato_bag>.mcap \
#       --config /ws/src/ingest/config/ingest.wato.yaml

# ---------------------------------------------------------------------------
# Chunking — virtual time windows over the bag.  No physical splitting.
# ---------------------------------------------------------------------------
chunk_seconds: 30.0          # window length
chunk_overlap_seconds: 2.0   # overlap with neighbors so tracks can be stitched
reference_clock: lidar       # unused: frame_index pairs every LiDAR sweep with each camera

# ---------------------------------------------------------------------------
# Time alignment — used by artifacts/frame_index.py.
# ---------------------------------------------------------------------------
max_cam_offset_ms: 60.0      # drop a (sweep, cam) row if the camera frame is
                             # more than this far from the LiDAR sweep timestamp.
                             # WATO pano cameras run ~11.9 Hz (~84 ms spacing) and
                             # LiDAR ~19.8 Hz (~50 ms), so the nearest camera to a
                             # sweep can sit ~42 ms away — 60 ms leaves margin
                             # without admitting a full frame of skew.

# ---------------------------------------------------------------------------
# Pose requirements — same values as ingest.yaml (README "Poses").
# ---------------------------------------------------------------------------
pose_requirements:
  min_dense_fraction: 0.9      # chunk: share of the pose span whose samples are
                               # <= max_bracket_ms apart; below this ingest
                               # ABORTS (PoseRequirementError).  Dense streams
                               # measure 1.0; keyframe-rate eidos 0.0.
  max_bracket_ms: 250.0        # stretch: two consecutive poses further apart
                               # than this can't be interpolated between; no
                               # sweep, point or camera frame inside gets a pose.
  max_speed_mps: 30.0          # stretch: implied speed between two consecutive
                               # poses above this is a jump (loop closure, INS
                               # reset), not motion.

# ---------------------------------------------------------------------------
# Topic mapping: logical name (used in artifact paths) → bag topic.
# ---------------------------------------------------------------------------
topics:
  # 8-camera panoramic ring (nn/ne/ee/se/ss/sw/ww/nw), 1280x1024 at ~12 Hz.
  # The four camera_lower_{ne,nw,se,sw} cameras are recorded and calibrated
  # too; add them the same way to ingest them. Recordings without
  # camera_pano_ee / camera_pano_ww use ingest.wato_6cam.yaml.
  #
  # rectified: the car's rectify node (wato_monorepo perception_bringup
  # template_camera_load.yaml) publishes rectified images, described by
  # camera_info.P, not K + D. P's focal length is 1.4-2.4% below K's and its
  # principal point up to 5 px off: projecting with K would misplace points by
  # ~15-25 px at the image edges.
  #
  # Which form of the rectified image a recording carries varies:
  #   image_rect_compressed  JPEG sensor_msgs/CompressedImage, stored verbatim
  #                          (.jpg). May 30 ring-road tests, Feb 17 / Feb 24 /
  #                          Mar 1 2026 recordings — what this profile reads.
  #   image_rect             raw bgr8 sensor_msgs/Image, stored as lossless PNG.
  #                          recording_20260215_215733, recording_20260309_*:
  #                          point the image topics below at /image_rect.
  cameras:
    PANO_NN: { image: /camera_pano_nn/image_rect_compressed, info: /camera_pano_nn/camera_info, rectified: true }
    PANO_NE: { image: /camera_pano_ne/image_rect_compressed, info: /camera_pano_ne/camera_info, rectified: true }
    PANO_EE: { image: /camera_pano_ee/image_rect_compressed, info: /camera_pano_ee/camera_info, rectified: true }
    PANO_SE: { image: /camera_pano_se/image_rect_compressed, info: /camera_pano_se/camera_info, rectified: true }
    PANO_SS: { image: /camera_pano_ss/image_rect_compressed, info: /camera_pano_ss/camera_info, rectified: true }
    PANO_SW: { image: /camera_pano_sw/image_rect_compressed, info: /camera_pano_sw/camera_info, rectified: true }
    PANO_WW: { image: /camera_pano_ww/image_rect_compressed, info: /camera_pano_ww/camera_info, rectified: true }
    PANO_NW: { image: /camera_pano_nw/image_rect_compressed, info: /camera_pano_nw/camera_info, rectified: true }
  lidars:
    # Per-sensor sweeps, NOT the merged /lidar/all/points_merged cloud:
    # lidar_preprocessing ray-casts each sweep from one sensor origin, and
    # rays from one origin through a three-scanner cloud carve occupied voxels
    # and leak static structure into dynamic_map.npz. Grouping sweeps into
    # frames is lidar_preprocessing's frame_sync (canonical_lidar: lidar_cc).
    lidar_cc: /lidar_cc/velodyne_points   # centre VLP-32C (canonical)
    lidar_ne: /lidar_ne/velodyne_points   # corner VLP-16
    lidar_nw: /lidar_nw/velodyne_points   # corner VLP-16
  # Pose: eidos LISO odometry — map frame, child=base_footprint, one pose per
  # GICP-matched lidar_cc scan, stamped at the scan (so a bag that dropped
  # scans can fail the density check). NOT slam/odometry (keyframe-rate on
  # eidos main; late-stamped LISO on ring_road_corrected), NOT
  # /novatel/oem7/odom (not validated), NOT /tf (wall-clock-stamped).
  # docs/ingest_measurements.md.
  pose: /world_modeling/liso/odometry
  tf_static: /tf_static

# ---------------------------------------------------------------------------
# TF parent for ego_T_cam / ego_T_lidar. Must equal the pose topic's
# child_frame_id (ingest aborts otherwise).
# ---------------------------------------------------------------------------
ego_frame: base_footprint

# ---------------------------------------------------------------------------
# Per-chunk quality thresholds — drive the tags emitted in quality.json.
# ---------------------------------------------------------------------------
quality_thresholds:
  low_light_v_max:           50.0    # mean V (HSV) below this → LOW_LIGHT
  stationary_speed_mps:       0.5    # mean ego speed below this → STATIONARY
  min_pose_availability:      0.95   # frame_index pose-valid fraction below this → POSE_MISSING
  max_camera_drop_fraction:   0.10   # fraction of dropped (sweep, cam) rows above this → CAMERA_DROPS
  min_lidar_points:       10000      # any sweep below this → LOW_LIDAR_POINTS
