# wato_ingest configuration — WATO panoramic-rig recordings.
#
# Companion to ingest.yaml (the nuScenes profile).  Same schema
# (wato_ingest.config.IngestConfig); only the dataset-specific values differ
# (topic names, ego frame, sensor-rate-dependent tolerances).
#
# Switch datasets per run via --config, e.g.:
#   ./watod run ingest /data/bags/<wato_bag>.mcap \
#       --config /ws/src/ingest/config/ingest.wato.yaml
# The nuScenes profile (ingest.yaml) is the default when --config is omitted.

# ---------------------------------------------------------------------------
# Chunking — virtual time windows over the bag.  No physical splitting.
# ---------------------------------------------------------------------------
chunk_seconds: 30.0          # window length
chunk_overlap_seconds: 2.0   # overlap with neighbors so tracks can be stitched
reference_clock: lidar       # which sensor stream defines a "frame"

# ---------------------------------------------------------------------------
# Time alignment — used by artifacts/frame_index.py.
# ---------------------------------------------------------------------------
max_cam_offset_ms: 60.0      # drop a (sweep, cam) row if the camera frame is
                             # more than this far from the LiDAR sweep timestamp.
                             # WATO pano cameras run ~11.9 Hz (~84 ms spacing) and
                             # LiDAR ~19.8 Hz (~50 ms), so the nearest camera to a
                             # sweep can sit ~42 ms away — 60 ms leaves margin
                             # without admitting a full frame of skew.

# ---------------------------------------------------------------------------
# Pose requirements — the pose topic must be DENSE and SMOOTH (same values as
# ingest.yaml; README "Pose requirements").  Measured on WATO bags:
#   ring_road_corrected slam/odometry  dense 1.0 → passes the checks, but its
#                                      poses are liso/odometry poses stamped
#                                      244-450 ms late (README "How good are
#                                      the poses") — the checks can't see that
#   ring_road_corrected liso/odometry  dense 1.0, 50 ms → passes; agrees with
#                                      the NovAtel INS to ~5 cm per second
#   may_30 slam/odometry (eidos main)  908 ms median (1 pose / 5 m), dense 0.0
#                                      → ABORTS
# ---------------------------------------------------------------------------
pose_requirements:
  min_dense_fraction: 0.9      # chunk: share of the pose span whose samples are
                               # <= max_bracket_ms apart; below this ingest
                               # ABORTS (PoseRequirementError).  Dense streams
                               # measure 1.0; keyframe-rate eidos 0.0.
  max_bracket_ms: 250.0        # stretch: two consecutive poses further apart
                               # than this can't be interpolated between; no
                               # sweep, point or camera frame inside gets a pose.
  max_speed_mps: 30.0          # stretch: implied speed between two consecutive
                               # poses above this is a jump (loop closure, INS
                               # reset), not motion.

# ---------------------------------------------------------------------------
# Topic mapping.  LEFT side is the logical name ingest uses for outputs
# (cam_<id>/, lidar_<id>/, etc.).  RIGHT side is the actual topic in the bag.
# ---------------------------------------------------------------------------
topics:
  # WATO runs a 6-camera panoramic ring (compass-labelled: nn/ne/se/ss/sw/nw).
  # Logical names keep the pano labels so artifact paths stay honest to the rig.
  cameras:
    PANO_NN: { image: /camera_pano_nn/image_rect_compressed, info: /camera_pano_nn/camera_info }
    PANO_NE: { image: /camera_pano_ne/image_rect_compressed, info: /camera_pano_ne/camera_info }
    PANO_SE: { image: /camera_pano_se/image_rect_compressed, info: /camera_pano_se/camera_info }
    PANO_SS: { image: /camera_pano_ss/image_rect_compressed, info: /camera_pano_ss/camera_info }
    PANO_SW: { image: /camera_pano_sw/image_rect_compressed, info: /camera_pano_sw/camera_info }
    PANO_NW: { image: /camera_pano_nw/image_rect_compressed, info: /camera_pano_nw/camera_info }
  lidars:
    # Per-sensor sweeps, NOT the merged /lidar/all/points_merged cloud.
    # lidar_preprocessing's classify step ray-casts every sweep from a single
    # sensor origin; the merged cloud mixes returns from three physically
    # offset scanners, so rays traced from any one origin carve through
    # genuinely occupied voxels (worst near the vehicle) and leak static
    # structure into dynamic_map.npz.  Ingesting the raw per-corner topics
    # gives every sweep its true origin; grouping sweeps into frames is
    # handled downstream by lidar_preprocessing's frame_sync
    # (canonical_lidar: lidar_cc — see lidar_preprocessing.wato.yaml).
    # NOTE: frame_index.parquet gains one row per (sweep, cam) for EVERY
    # lidar, so per-corner ingest triples its row count vs. the merged topic.
    lidar_cc: /lidar_cc/velodyne_points   # centre VLP-32C (canonical)
    lidar_ne: /lidar_ne/velodyne_points   # corner VLP-16
    lidar_nw: /lidar_nw/velodyne_points   # corner VLP-16
  # Pose: eidos SLAM odometry — SLAM map frame, child=base_footprint.  This is
  # the back end's newest-KEYFRAME pose: on eidos main one pose per 5 m, which
  # ingest aborts on (pose_requirements above).  In ring_road_corrected it is
  # liso/odometry resampled at 10 Hz and stamped 244-450 ms late (median 310).
  # /world_modeling/liso/odometry (per scan, stamped at scan time, same child
  # frame) is the better per-sweep pose there — README "How good are the
  # poses".
  # Bags without eidos topics use ingest.wato_novatel.yaml.  Do NOT use /tf
  # (wall-clock-stamped; desyncs from LiDAR).
  pose: /world_modeling/slam/odometry
  # WATO publishes rigid sensor extrinsics on /tf_static (read once at bag
  # scope to populate calibration.json).
  tf_static: /tf_static

# ---------------------------------------------------------------------------
# Ego frame name used as the TF parent when resolving ego_T_cam / ego_T_lidar
# from /tf_static.  MUST equal the pose topic's child_frame_id — ingest checks
# and aborts otherwise.  eidos's slam/odometry has child_frame_id=base_footprint.
# ---------------------------------------------------------------------------
ego_frame: base_footprint

# ---------------------------------------------------------------------------
# Per-chunk quality thresholds — drive the tags emitted in quality.json.
# ---------------------------------------------------------------------------
quality_thresholds:
  low_light_v_max:           50.0    # mean V (HSV) below this → LOW_LIGHT
  stationary_speed_mps:       0.5    # mean ego speed below this → STATIONARY
  min_pose_availability:      0.95   # frame_index pose-valid fraction below this → POSE_MISSING
  max_camera_drop_fraction:   0.10   # fraction of dropped (sweep, cam) rows above this → CAMERA_DROPS
  min_lidar_points:       10000      # any sweep below this → LOW_LIDAR_POINTS
