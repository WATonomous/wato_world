# wato_ingest configuration — nuScenes rosbag profile (the default when
# --config is omitted). Schema: wato_ingest.config.IngestConfig.

# ---------------------------------------------------------------------------
# Chunking — virtual time windows over the bag.  No physical splitting.
# ---------------------------------------------------------------------------
chunk_seconds: 30.0          # window length
chunk_overlap_seconds: 2.0   # overlap with neighbors so tracks can be stitched
reference_clock: lidar       # unused: frame_index pairs every LiDAR sweep with each camera

# ---------------------------------------------------------------------------
# Time alignment — used by artifacts/frame_index.py.
# ---------------------------------------------------------------------------
max_cam_offset_ms: 50.0      # drop a (sweep, cam) row if the camera frame is
                             # more than this far from the LiDAR sweep timestamp

# ---------------------------------------------------------------------------
# Pose requirements — the pose topic must be dense and smooth (README "Poses";
# measurements in docs/ingest_measurements.md). Physics, not dataset tuning:
# every profile uses the same values. nuScenes /odom: 20 ms median spacing,
# dense fraction 1.0.
# ---------------------------------------------------------------------------
pose_requirements:
  min_dense_fraction: 0.9      # chunk: share of the pose span whose samples are
                               # <= max_bracket_ms apart; below this ingest
                               # ABORTS (PoseRequirementError).  Dense streams
                               # measure 1.0; keyframe-rate eidos 0.0.
  max_bracket_ms: 250.0        # stretch: two consecutive poses further apart
                               # than this can't be interpolated between
                               # (pose_gap_*); no sweep, point or camera frame
                               # inside the stretch gets a valid pose.
  max_speed_mps: 30.0          # stretch: implied ego speed between two
                               # consecutive poses above this is a jump (loop
                               # closure, INS reset), not motion (pose_jump_*).
                               # Raise it for highway data (>108 km/h).

# rosbag2's storage plugin (mcap / sqlite3) is detected from the bag; set
# `storage_id: <plugin>` only to force one.

# ---------------------------------------------------------------------------
# Topic mapping: logical name (used in artifact paths) → bag topic.
# `python -m wato_ingest inspect-bag --bag <bag>` lists a bag's topics.
# Accepted types:
#   cameras.*.image  sensor_msgs/CompressedImage (JPEG/PNG) or sensor_msgs/Image
#                    (rgb8, bgr8, rgba8, bgra8, mono8)
#   cameras.*.info   sensor_msgs/CameraInfo
#   lidars.*         sensor_msgs/PointCloud2 (one topic per physical LiDAR)
#   pose             nav_msgs/Odometry, geometry_msgs/PoseStamped or
#                    geometry_msgs/PoseWithCovarianceStamped
#   tf_static        tf2_msgs/TFMessage
# `info` and `tf_static` feed calibration.json and may be left out when
# passing --calibration <file>.
# ---------------------------------------------------------------------------
topics:
  cameras:
    CAM_FRONT:       { image: /CAM_FRONT/image_rect_compressed,       info: /CAM_FRONT/camera_info       }
    CAM_FRONT_LEFT:  { image: /CAM_FRONT_LEFT/image_rect_compressed,  info: /CAM_FRONT_LEFT/camera_info  }
    CAM_FRONT_RIGHT: { image: /CAM_FRONT_RIGHT/image_rect_compressed, info: /CAM_FRONT_RIGHT/camera_info }
    CAM_BACK:        { image: /CAM_BACK/image_rect_compressed,        info: /CAM_BACK/camera_info        }
    CAM_BACK_LEFT:   { image: /CAM_BACK_LEFT/image_rect_compressed,   info: /CAM_BACK_LEFT/camera_info   }
    CAM_BACK_RIGHT:  { image: /CAM_BACK_RIGHT/image_rect_compressed,  info: /CAM_BACK_RIGHT/camera_info  }
  lidars:
    LIDAR_TOP: /LIDAR_TOP
  # nuScenes carries its static transforms on /tf.
  tf_static: /tf
  # nav_msgs/Odometry, map frame, child_frame_id=base_link.
  pose: /odom

# ---------------------------------------------------------------------------
# Ego frame name used as the TF parent when resolving ego_T_cam / ego_T_lidar
# from the configured TFMessage topic.
# ---------------------------------------------------------------------------
ego_frame: base_link

# ---------------------------------------------------------------------------
# Per-chunk quality thresholds — drive the tags emitted in quality.json.
# ---------------------------------------------------------------------------
quality_thresholds:
  low_light_v_max:           50.0    # mean V (HSV) below this → LOW_LIGHT
  stationary_speed_mps:       0.5    # mean ego speed below this → STATIONARY
  min_pose_availability:      0.95   # frame_index pose-valid fraction below this → POSE_MISSING
  max_camera_drop_fraction:   0.10   # fraction of dropped (sweep, cam) rows above this → CAMERA_DROPS
  min_lidar_points:       10000      # any sweep below this → LOW_LIDAR_POINTS
