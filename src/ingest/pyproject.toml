[project]
name = "wato-world-ingest"
version = "0.1.0"
description = "Rosbag ingest for frames, LiDAR, poses, and frame_index artifacts."
requires-python = ">=3.11"
dependencies = [
    "wato-world-common",
    "click>=8",
    "pyyaml>=6",
    "pydantic>=2",
    "pyarrow>=15",
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
wato_ingest = "wato_ingest.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_ros"
