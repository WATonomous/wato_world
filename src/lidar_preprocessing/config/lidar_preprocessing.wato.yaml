lidar_preprocessing:
  # ====================================================================
  # WATO 3-Velodyne rig (VLP-32C centre + 2× VLP-16 corners). Ingest with
  # ingest.wato.yaml / ingest.wato_6cam.yaml (per-corner LiDAR topics).
  #   ./watod run lidar_preprocessing --bag <wato_bag> \
  #       --config /ws/src/lidar_preprocessing/config/lidar_preprocessing.wato.yaml
  # ====================================================================

  # One datasheet profile per scanner; everything physical follows from it.
  sensor_model:
    profile: vlp32c
    per_lidar:
      lidar_cc: vlp32c
      lidar_ne: vlp16
      lidar_nw: vlp16

  filter_nonfinite_points: true

  synthesize_per_point_times: true

  require_patchwork: true
  allow_uncompensated_motion: false

  voxel_size_m: 0.25
  min_observations: 3

  # Cleanup of the voxel verdict's dynamic points. Tuned on this rig
  # (docs/lidar_preprocessing_measurements.md).
  dynamic_filter:
    min_cluster_pts: 5
    persistence_max_s: 0.5

  cache_world_xyz_in_memory: true

  global_map_voxel_size_m: 0.30

  # Velodyne `time` is in seconds, but all zero on every WATO bag measured, so
  # deskew synthesizes times from azimuth.
  point_time_unit: "seconds"

  # The car's Velodyne driver stamps each sweep with its LAST packet
  # (`timestamp_first_packet: false` in wato_monorepo
  # src/interfacing/sensor_interfacing/config/velodyne_lidar_config.yaml).
  header_stamp_at: sweep_end

  patchwork:
    sensor_height: 1.8
    num_iter: 3
    num_lpr: 20
    num_min_pts: 10
    th_seeds: 0.3
    th_dist: 0.15
    th_seeds_v: 0.25
    th_dist_v: 0.85
    max_range: 90.0
    min_range: 1.0
    uprightness_thr: 0.101
    enable_RNR: false
    verbose: false
    ground_cell_size_m: 0.25

  # Group the three per-corner sweeps into one frame per centre-LiDAR tick.
  frame_sync:
    canonical_lidar: lidar_cc
    tolerance_ms: 25.0

  # Steps E/F: as the nuScenes profile. Proposals cluster per frame_sync
  # frame, so one tick's three sweeps form one object.
  iwu:
    enabled: true
    update_rate_hz: 4.0

  motion_proposals:
    enabled: true
    min_height_above_ground_m: 0.25
    min_cluster_pts: 5
    max_side_m: 20.0
    box_fill: true

  save_voxel_occupancy: true
  save_voxel_diagnostics: true
  save_per_frame_voxel_occupancy: false
