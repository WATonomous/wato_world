lidar_preprocessing:
  # ====================================================================
  # nuScenes profile (the default).
  # ====================================================================
  # Companion: lidar_preprocessing.wato.yaml — same schema tuned for the
  # WATO 3-Velodyne rig.  Switch per run via --config, mirroring ingest's
  # ingest.yaml / ingest.wato.yaml:
  #   ./watod run lidar_preprocessing --bag <wato_bag> \
  #       --config /ws/src/lidar_preprocessing/config/lidar_preprocessing.wato.yaml
  #
  # This file states WHICH SENSORS the bag was recorded with and the handful
  # of choices that are genuinely ours to make.  It states no physics: beam
  # count, field of view, spin rate, range accuracy, beam divergence, usable
  # range, intensity scale and every log-odds constant derived from them come
  # from the scanner profile in sensor_model.py.  If a number here looks like
  # it belongs on a datasheet, it is in the wrong file.

  # ====================================================================
  # Sensor model — the SINGLE source of every classifier constant.
  # ====================================================================
  # profile:   the scanner this bag was recorded with.
  # per_lidar: {lidar_id: profile} overrides for a mixed rig.
  #
  # Available: hdl32e (nuScenes LIDAR_TOP), vlp32c, vlp16.
  #
  # The profile fixes l_occ, l_free, the log-odds clamp, the static/dynamic
  # decision thresholds, the range-credibility crossover, the carve margin,
  # the grazing-incidence gate, the scan rate and direction, and the MF-MOS
  # projection geometry.  None of those are knobs here — changing the labeller
  # means changing sensor_model.py, where the reasoning is written down.
  sensor_model:
    profile: hdl32e

  # ====================================================================
  # Step A — deskew (rolling-shutter motion compensation).
  # ====================================================================
  # Drop NaN/inf points before deskew.
  filter_nonfinite_points: true

  # When raw NPZ lacks per-point timestamps, synthesize them from azimuth
  # assuming uniform rotation (required for nuScenes; without it, intra-sweep
  # ego motion smears statics across voxels and leaks them into dynamic_map).
  # The rotation period and direction come from the sensor profile.
  synthesize_per_point_times: true

  # Fail loudly rather than silently degrade.
  require_patchwork: true
  allow_uncompensated_motion: false

  # ====================================================================
  # Step B — voxel static/dynamic classification.
  # ====================================================================
  # Edge length of the cubic occupancy voxels.  Smaller → finer fidelity but
  # more sensitive to pose drift / beam spacing; larger → small objects smear.
  # A genuine trade-off with no datasheet answer, so it lives here.
  voxel_size_m: 0.25

  # How many ray traversals a voxel needs before its occupancy probability is
  # believed at all.  Below this the voxel is UNDER_EVIDENCED: neither static
  # nor dynamic.  The only evidence gate — "was anything ever measured here?"
  # needs no threshold and is not configurable.
  min_observations: 3

  cache_world_xyz_in_memory: true

  # ====================================================================
  # Step D — global static map reduce + two-pass prior.
  # ====================================================================
  # Voxel size used when merging per-chunk static maps into the global map.
  # Doubles as the two-pass prior's KDTree match radius: reduce snaps points
  # to voxel centres, so "within one map voxel" is what a match means.  The
  # prior's strength and range falloff are derived from the sensor model.
  global_map_voxel_size_m: 0.30

  # Unit of ingest's per-point t_offset_us field.  "seconds" |
  # "microseconds" | "nanoseconds".  A property of the bag's driver, not the
  # scanner — nuScenes conversions emit seconds.
  point_time_unit: "seconds"

  # ====================================================================
  # Step C — Patchwork++ ground segmentation.
  # Parameters mirror wato_monorepo perception/patchwork config/params.yaml.
  # ====================================================================
  patchwork:
    sensor_height: 1.8
    num_iter: 3
    num_lpr: 20
    num_min_pts: 10
    th_seeds: 0.3
    th_dist: 0.15            # Ground-inlier distance threshold (m).
    th_seeds_v: 0.25
    th_dist_v: 0.85
    max_range: 90.0
    min_range: 1.0
    uprightness_thr: 0.101
    enable_RNR: false
    verbose: false
    ground_cell_size_m: 0.25

  # ====================================================================
  # Multi-lidar frame grouping (SAM4D alignment).
  # ====================================================================
  # canonical_lidar: null → each sweep is its own frame (single-LiDAR bags
  #   like nuScenes mini).  "lidar_cc" → side sweeps within ±tolerance_ms
  #   inherit the centre LiDAR's frame_id (WATO 3-Velodyne rig).
  frame_sync:
    canonical_lidar: null
    tolerance_ms: 25.0

  # ====================================================================
  # Step A.5 — MF-MOS learned moving-object segmentation.
  # ====================================================================
  # Weights: https://github.com/SCNU-RISLAB/MF-MOS/releases — drop at
  # /data/models/mf_mos/ (mounted via docker-compose.yaml).
  #
  # The spherical projection is NOT configured here.  Range-image rows, FoV
  # bounds and intensity scale come from each lidar's sensor profile; image
  # width, the training range window and the residual-channel spacing are
  # properties of the released checkpoint and live in mf_mos/_core.py.  A
  # scanner with too few channels to project is skipped with a log line.
  mf_mos:
    enabled: true
    checkpoint_path: /data/models/mf_mos/mf_mos_semantic_kitti.pt
    arch_config:   /data/models/mf_mos/arch_cfg.yaml
    data_config:   /data/models/mf_mos/data_cfg.yaml

    device: cuda
    score_threshold: 0.7
    save_scores: true

    # How MF-MOS masks combine with the voxel classifier.
    #   "independent" → masks exported alongside; the voxel classifier alone
    #                   decides dynamic_map.npz.  Downstream may read both.
    #   "union"       → dynamic if either signal says so.  A missing or empty
    #                   MF-MOS mask leaves the classifier's verdict intact.
    # Keep this at independent until MF-MOS mask quality has been audited on
    # the rig in question (scripts/debug_mfmos_contribution.py).
    fusion_mode: independent

    max_pose_gap_ms: 6000
    occlusion_range_tol_m: 1.0
    prime_window_from_prior_chunk: true

    # --- Per-sweep spatial denoise (replaces the old chunk-wide vote tier) ---
    # MF-MOS speckle is removed spatially, in the sweep where it occurs:
    # moving points are clustered on a coarse 3D grid (26-connectivity) and
    # clusters below the minimum size are dropped.  Temporal confirmation of a
    # mover is the downstream tracker's job, not this stage's — so fast
    # few-sweep movers survive (the old vote denominator killed them).
    #
    # Connected-component grid resolution (m).  ~2× voxel_size keeps a real
    # object connected across beam gaps without bridging separate objects.
    moving_cluster_voxel_m: 0.5
    # Drop moving clusters smaller than this.  Grounded in point density: the
    # smallest object of interest (pedestrian) at the far edge of reliable
    # MF-MOS range subtends well above this on a 32-beam sensor, while
    # single-sweep mispredictions are 1–few isolated points.
    moving_min_cluster_pts: 8

  # ====================================================================
  # Diagnostic / export toggles.
  # ====================================================================
  # voxel_occupancy.npz (all occupied voxels, aggregated) — QA/viz.
  save_voxel_occupancy: true
  # voxel_diag.npz (per-voxel log_odds / n_obs / n_hits / classification,
  # including carved voxels) — powers the viz p_occ color mode.
  save_voxel_diagnostics: true
  # One voxel_occupancy_frame_NNNN.npz per frame_id (what perception_2d feeds
  # to MinkUNet).  Disabled until perception_2d is wired up.
  save_per_frame_voxel_occupancy: false
