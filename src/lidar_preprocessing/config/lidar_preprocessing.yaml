lidar_preprocessing:
  # ====================================================================
  # nuScenes profile (the default). Schema and field docs: config.py.
  # WATO rig: lidar_preprocessing.wato.yaml.
  # ====================================================================
  # This file names the scanners and the few genuinely free choices. It
  # states no physics: beam count, FoV, spin rate, range accuracy, beam
  # divergence, usable range, intensity scale and every log-odds constant
  # come from the scanner profile in sensor_model.py.

  # Scanner profile (hdl32e = nuScenes LIDAR_TOP; also vlp32c, vlp16).
  # per_lidar: {lidar_id: profile} for a mixed rig.
  sensor_model:
    profile: hdl32e

  # ====================================================================
  # Step B method: aw | mos | union (`--seg` overrides).
  # ====================================================================
  segmentation: aw

  # --- seg=union ---
  union:
    aw_static_veto: true
    keep_aw_dynamic: false
    # MF-MOS score that survives the veto (parked-then-moving objects).
    # Needs mf_mos.save_scores; null = off. Suggested start: 0.9.
    veto_score_exempt: null
    ground_height_veto_m: 0.25
    veto_dilation_voxels: 1
    # Tuning: docs/lidar_preprocessing_measurements.md.
    motion_filter:
      enabled: true
      persistence_max_sweeps: 20    # sweep COUNT — scale with sensor Hz; 0 = off
      persistence_voxel_m: 0.5
      coherence_min_life: 0         # off: cuts real movers on sparse LiDAR
      coherence_cell_m: 0.4
      coherence_link_gate_m: 3.0
      coherence_max_object_m: 7.0

  # ====================================================================
  # Step A — deskew.
  # ====================================================================
  filter_nonfinite_points: true
  # nuScenes sweeps carry no per-point times; synthesize from azimuth.
  synthesize_per_point_times: true
  require_patchwork: true
  allow_uncompensated_motion: false

  # ====================================================================
  # Step B — voxel classification.
  # ====================================================================
  # Smaller = finer but more sensitive to pose drift / beam spacing.
  voxel_size_m: 0.25
  min_observations: 3
  dynamic_min_range_m: 2.5
  cache_world_xyz_in_memory: true

  # ====================================================================
  # Step D — global map voxel; also the match radius of the two-pass prior,
  # IWU (the paper's 30 cm) and Step F.
  # ====================================================================
  global_map_voxel_size_m: 0.30

  # nuScenes conversions emit seconds.
  point_time_unit: "seconds"
  # Unverified for nuScenes: camera trigger offsets only locate the cut
  # angle, which a rotation's start and end share.
  header_stamp_at: sweep_start

  # ====================================================================
  # Step C — Patchwork++ (mirrors wato_monorepo perception/patchwork
  # config/params.yaml).
  # ====================================================================
  patchwork:
    sensor_height: 1.8
    num_iter: 3
    num_lpr: 20
    num_min_pts: 10
    th_seeds: 0.3
    th_dist: 0.15            # Ground-inlier distance threshold (m).
    th_seeds_v: 0.25
    th_dist_v: 0.85
    max_range: 90.0
    min_range: 1.0
    uprightness_thr: 0.101
    enable_RNR: false
    verbose: false
    ground_cell_size_m: 0.25

  # Single LiDAR: each sweep is its own frame.
  frame_sync:
    canonical_lidar: null
    tolerance_ms: 25.0

  # ====================================================================
  # MF-MOS (seg=mos / union only). Weights:
  # https://github.com/SCNU-RISLAB/MF-MOS/releases → /data/models/mf_mos/.
  # Projection geometry comes from the sensor profile, not here.
  # ====================================================================
  mf_mos:
    checkpoint_path: /data/models/mf_mos/mf_mos_semantic_kitti.pt
    arch_config:   /data/models/mf_mos/arch_cfg.yaml
    data_config:   /data/models/mf_mos/data_cfg.yaml

    device: cuda
    score_threshold: 0.7
    save_scores: true

    max_pose_gap_ms: 6000
    # Keep above the longest residual baseline (~800 ms on any rig).
    max_residual_gap_ms: 1000
    occlusion_range_tol_m: 1.0
    prime_window_from_prior_chunk: true

    moving_cluster_voxel_m: 0.5
    moving_min_cluster_pts: 8

  # ====================================================================
  # Step E — IWU (bag level). α / τ are the paper's (iwu/_core.py).
  # ====================================================================
  iwu:
    enabled: true
    update_rate_hz: 4.0

  # ====================================================================
  # Step F — motion proposals (Chen et al. 2022).
  # ====================================================================
  motion_proposals:
    enabled: true
    min_height_above_ground_m: 0.25
    min_cluster_pts: 5        # Chen N_min
    max_side_m: 20.0          # Chen T_size
    box_fill: true

  # ====================================================================
  # Diagnostic exports.
  # ====================================================================
  save_voxel_occupancy: true
  save_voxel_diagnostics: true     # powers the viz p_occ color mode
  save_per_frame_voxel_occupancy: false
