[project]
name = "wato-world-detection-3d"
version = "0.1.0"
description = "Learned 3D boxes from BEVFusion (camera + LiDAR), the model the car runs."
requires-python = ">=3.11"
dependencies = [
    "wato-world-common",
    "click>=8",
    "pyyaml>=6",
    "pydantic>=2",
    "numpy",
    "pillow",
]

[project.scripts]
wato_detection_3d = "wato_detection_3d.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
