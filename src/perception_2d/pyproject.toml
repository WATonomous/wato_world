[project]
name = "wato-world-perception-2d"
version = "0.1.0"
description = "2D perception pass with GroundingDINO, SAM 2, DEVA, DINOv2, and cross-camera merge."
requires-python = ">=3.11"
dependencies = [
    "wato-world-common",
    "click>=8",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.scripts]
wato_perception_2d = "wato_perception_2d.cli:main"

[project.optional-dependencies]
gpu = [
    "torch",
    "torchvision",
    "xformers",
    # sam2, GroundingDINO, sam3 installed via Dockerfile git URLs — not pinnable here
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
