[project]
name = "wato-world-perception-2d"
version = "0.1.0"
description = "2D perception pass with GroundingDINO, SAM 2, DEVA, DINOv2, and cross-camera merge."
requires-python = ">=3.11"
dependencies = [
    "wato-world-common",
    "click>=8",
    "pyyaml>=6",
    "pydantic>=2",
    "numpy>=1.26",
    "pillow>=10",
    "pyarrow>=14",
]

# Heavy GPU stack — installed by docker/perception_2d.Dockerfile, not at
# `pip install -e`.  Listed here so `pip install -e .[gpu]` works for local
# dev outside containers; CI installs them via the Dockerfile.
[project.optional-dependencies]
gpu = [
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.3",
    "depth-anything-v2 @ git+https://github.com/DepthAnything/Depth-Anything-V2.git",
]

[project.scripts]
wato_perception_2d = "wato_perception_2d.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
