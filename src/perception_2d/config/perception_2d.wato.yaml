# perception_2d for the WATO rig (ingest.wato*.yaml bags): perception_2d.yaml
# plus the rig's ego mask; a test fails if anything else drifts.
#   ./watod run perception_2d --bag <wato_bag> \
#       --config /ws/src/perception_2d/config/perception_2d.wato.yaml

discovery:
  # Source of the class vocabulary fed to the detector:
  #   "fixed"     → closed-set taxonomy (`fixed_classes` / prompts.yaml).
  #   "florence2" → open-vocabulary noun phrases discovered per frame by
  #                 Florence-2, pooled into one concept set per camera.
  backend: "fixed"
  model: "microsoft/Florence-2-large-ft"
  min_confidence: 0.3
  sample_every_k: 10   # florence2 only: run discovery on every k-th frame
  # Used when backend: "fixed".  Empty → falls back to the prompts.yaml taxonomy.
  # No traffic cone or barrier: no detector tried finds them on WATO
  # (docs/perception_2d_measurements.md), and a class listed but never detected
  # would be labelled absent from every image.
  fixed_classes: ["car", "truck", "bus", "motorcycle", "bicycle", "pedestrian"]

detection:
  # Box source for SAM2:
  #   "yolo"           → closed-set YOLO26 (COCO weights), mapped onto the
  #                      taxonomy by yolo.class_map. Requires
  #                      discovery.backend: fixed.
  #   "grounding_dino" → open-vocabulary GroundingDINO, text-prompted by the
  #                      taxonomy (or by Florence-2 discovery).
  backend: "yolo"

  yolo:
    # Pinned weights (model_registry: yolo26; scripts/fetch_models.py). Loaded
    # by path — never by name, which would download whatever upstream ships.
    checkpoint: "/data/models/yolo26x.pt"
    conf: 0.25            # min box confidence
    iou: 0.7              # NMS IoU
    imgsz: 1280           # inference size; WATO frames are 1280x1024
    # COCO class → taxonomy class; anything unmapped is dropped, and a taxonomy
    # class nothing maps to is never detected (logged at startup). COCO labels a
    # cyclist "person" (→ pedestrian) plus a separate "bicycle".
    class_map:
      person: pedestrian
      bicycle: bicycle
      car: car
      motorcycle: motorcycle
      bus: bus
      truck: truck

  # grounding_dino — HuggingFace checkpoint ("...-tiny" is lighter/faster).
  model: "IDEA-Research/grounding-dino-base"
  box_threshold: 0.35   # min box confidence
  text_threshold: 0.25  # min text-token match score
  nms_iou: 0.5          # per-class NMS IoU to drop duplicate boxes

  # Both backends: detect every k images to pick up objects entering mid-clip.
  redetect_every_k: 2

segmentation:
  # Official DAM4SAM memory selection, existing SAM2.1 weights, no training.
  # Set sam2 to reproduce the previous propagation baseline.
  backend: "dam4sam"
  # Local SAM2.1 checkpoint path (the container runs HF_HUB_OFFLINE=1).
  checkpoint: "/data/models/sam2.1_hiera_large.pt"
  config: "configs/sam2.1/sam2.1_hiera_l.yaml"  # bundled in the sam2 package
  refinement:
    # Experimental image-mask seeds / keyframe corrections sharing SAM2 weights.
    # Enable with --refine-masks --force; keep a separate baseline artifact root.
    # No WATO accuracy gain has been measured (src/perception_2d/README.md).
    enabled: false
    min_predicted_iou: 0.8  # SAM2 AMG default; not a calibrated correctness probability
    min_stability: 0.95    # SAM2 AMG default; threshold stability, not temporal stability
    stability_offset: 1.0
    multimask_output: false  # image API recommends single output for unambiguous prompts
    interior_point: true    # distance-interior click in the extra decoder pass
    mask_input_refinement: true  # selected low-resolution logits; ablate separately
    correct_shape_disagreement: false  # ablate separately after seed refinement
    # Engineering guardrails for fresh-mask vs propagated-mask IoU; validate on WATO.
    correction_min_mask_iou: 0.5
    correction_below_mask_iou: 0.8
  # Per-camera mask diagnostics under mask_quality/ (mask_quality.py). Off:
  # they cost a GPU sync per frame and 10-20 MB of JSON per WATO chunk.
  mask_quality: false
  # backend dam4sam: memory parameters the adapter sets (models/dam4sam.py).
  dam4sam:
    # Memory update spacing, in images. The authors use 5 at 30 fps and 1 at
    # 5 fps (one update per ~170-200 ms); 2 keeps that at 10-12 Hz cameras.
    update_delta: 2
    # SAMURAI's memory-bank gate: a frame stays in recent memory beyond the
    # next image only if SAM2's predicted IoU for it exceeds this (SAMURAI's
    # 0.5). Object pointers are not gated, as in SAMURAI. 0 disables.
    memory_min_predicted_iou: 0.5

tracking:
  # A re-detected box whose IoU with an already-tracked object's mask bbox is
  # >= this is treated as the existing object rather than starting a new track.
  iou_match_threshold: 0.5
  # Stock sam2: keep the frame stack in host RAM and stream to the GPU.
  # DAM4SAM always reads frames lazily on CPU; object memories stay on the GPU.
  offload_video_to_cpu: true
  # OOM fallback: retry the camera in windows of this many frames (fresh
  # session each), halving a window that OOMs down to min_sub_clip_frames,
  # then raising if it still cannot fit (never publish a camera with gaps).
  # Object ids reset between windows. `tracking` associates objects by their
  # 3D boxes, not masklet ids; nothing reads the DINOv2 embeddings yet.
  sub_clip_frames: 150
  min_sub_clip_frames: 16
  # SAM2 latches a lost object's id onto a similar nearby object within a few
  # images (on WATO, every such resume was a different object), so a track
  # ENDS when its object has had no mask for drop_lost_after_frames images
  # (0 = never). A re-detected object starts a new masklet.
  drop_lost_after_frames: 1
  # Drop a mask's specks: 8-connected components smaller than this fraction of
  # its largest one (the largest always stays, so distant objects survive).
  # Each speck would lift to 3D as whatever lies behind it. 0 disables.
  island_fraction: 0.1
  # Save independent masks, including contested pixels and contained masks.
  # Ownership is deferred until after lifting and geometric refinement.
  # Detector support on keyframes: a box matching a track's mask bbox
  # (iou_match_threshold) supports it, since SAM2 alone follows whatever its
  # mask becomes (the sky, the road). A track's keep-alive rises by one per
  # supported keyframe (up to support_keyframes) and falls by one per keyframe
  # its mask's bbox covers >= support_min_area of the image with no supporting
  # box; at 0 it ends (0 disables). Only large masks count: the detector boxes
  # a real mask over 0.3% of the image at 89-97% of keyframes, but a distant
  # car often only once (docs/perception_2d_measurements.md). Its class is the
  # one its boxes' scores sum highest for (COCO flips the shuttle between truck
  # and bus).
  support_keyframes: 5
  support_min_area: 0.01
  # A box scoring >= birth_score starts a track; a weaker one starts it
  # tentatively, its masks held back until boxes support it at
  # confirm_keyframes keyframes in a row (its own counts), dropped at the first
  # keyframe without. Off (0): COCO YOLO boxes real distant cars once at
  # 0.25-0.4, and confirmation kept only 26-48% of them.
  birth_score: 0.0
  confirm_keyframes: 3
  # Whether a box no track accounts for may start one, tested against the
  # masks of the live tracks and of the births already accepted at that
  # keyframe (highest score first). A refused box neither starts nor supports
  # a track. Both tests compare masks, not bboxes, so a part box inside a
  # tracked car and a box on one car of a mask bled over two are refused at
  # any detector score:
  #   untracked_area: SAM2MOT's object addition, more than
  #     birth_untracked_fraction (its 0.5) of the box lies outside every
  #     tracked mask;
  #   mask_iou: SAM 3's rule, SAM2's image mask for the box has IoU below
  #     birth_max_mask_iou (its 0.1) with every tracked mask (one extra image
  #     encoding per keyframe with births);
  #   none: every such box starts a track.
  birth_gate: "untracked_area"
  birth_untracked_fraction: 0.5
  birth_max_mask_iou: 0.1
  # Reverse back-fill (CTRL, OC-SORT, SAM4D): YOLO's first box on a distant
  # car is rarely its first appearance, so each track born after its window's
  # first image is propagated backwards from its birth prompt for up to
  # backfill_frames images (CTRL's 20 frames at 10 Hz). It stops at
  # drop_lost_after_frames empty masks, on the ego vehicle, or where its
  # mask's bbox fails the untracked_area test against the tracks recorded
  # there. 0 disables.
  backfill_frames: 20
  # A track backed by exactly one box scoring >= reprompt_score that backs no
  # other track, whose mask bbox has drifted below reprompt_below_iou from it,
  # is re-prompted with the box there. 0 disables.
  reprompt_score: 0.8
  reprompt_below_iou: 0.7
  # SAM2 precision on CUDA: bfloat16 (upstream's; flash attention), float16 or
  # float32. The detector and DINOv2 always run float32.
  autocast_dtype: "bfloat16"

# The WATO rig's own body as each camera sees it: the roof rack (NE, SE, SS,
# SW, NW), the hood (NN) and the antenna above the rear rack (SS); EE and WW
# see none of it. Traced from the median image over a drive (the scene blurs
# out, the rack stays sharp) and the masks of the masklets that tracked the
# rack as a truck, plus 6 px of margin (docs/perception_2d_measurements.md).
# A detection box or a track's mask at least max_fraction inside it is the
# vehicle and never becomes or stays a track; every mask loses its pixels.
ego_mask:
  image_size: [1280, 1024]   # rectified PANO images
  max_fraction: 0.5
  polygons:
    PANO_NE:
