depth:
  enabled: true
  model: "depth-anything-v2-large"
  # Frames per DA-V2 GPU batch (the depth pass has the GPU to itself). LiDAR
  # alignment stays sequential.
  batch_size: 4
  min_lidar_anchors: 30
  ransac_n_iter: 200
  ransac_inlier_threshold_m: 0.5
  fallback_window: 5
  sky_mask_top_fraction: 0.3
  output_dtype: "float16"

# DINOv2 embeddings per masklet, kept for a later `tracking` ReID (no
# component reads them yet).
embeddings:
  model: "dinov2_vitl14"
  every_k_frames: 1

prompts_path: "/config/prompts.yaml"
