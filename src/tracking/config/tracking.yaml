# tracking: tracks over proposal_generation's fused boxes, per chunk, linked
# across the spans neighbouring chunks share.
# Every field is documented in src/wato_tracking/config.py; the measurements
# behind the defaults are in docs/tracking_measurements.md.
tracking:
  association:
    cost: giou_3d                    # SimpleTrack's 1 − GIoU (or chen: Step F's)
    max_one_minus_giou: 1.5          # GIoU > −0.5, every class
    max_centre_dist_m: 2.0           # Chen's gates, for cost chen...
    max_one_minus_iou: 0.95
    max_one_minus_volume_ratio: 0.7
    max_coast_s: null                # null: coast until the chunk ends (Immortal Tracker)
    instance_bonus: 1.0              # same lifted instance as the track's last box
    instance_opens_shape_gates: true # ...is held only to max_centre_dist_m

  duplicates:                        # CenterPoint circle NMS per frame
    enabled: true
    groups:                          # min_radius: squared BEV distance, m²
      - {classes: [car], min_radius: 4.0}
      - {classes: [truck], min_radius: 12.0}
      - {classes: [bus], min_radius: 10.0}

  relink:                            # Offline-Poly STWO after the forward pass
    enabled: true
    horizon_s: 1.0                   # predictions past 1 s are discarded
    max_cost: 0.9                    # θ_blo, on 1 − IoU
    metric: iou_bev
    class_consistent: true           # never fuse two known, different classes
    shared_instance: true            # same lifted instance: fuse within max_centre_dist_m

  appearance:                        # ReID from perception_2d's masklet descriptors
    enabled: false                   # needs masklet_embeddings.npz on every chunk
    relink: true                     # look-alike tracks fuse within max_centre_dist_m
    association: false               # per-frame use: hurt the night scene
    budget: 100                      # descriptors kept per masklet (DeepSORT's gallery)
    max_cosine_distance: null        # θ_emb; null: calibrated on the bag's own pairs

  strong:                            # matched to tracks before weak boxes
    min_lift_confidence: 0.5         # a lone lifted box this confident...
    min_lift_points: 20              # ...with this many retained seed points
    min_detector_score: 0.5          # a fusion_detector box this sure (ByteTrack's track_thresh)
    min_detector_birth_score: 0.6    # a detector-only box starts a track only this sure (ByteTrack)

  motion:
    min_frames: 7                    # fewer: "unknown"
    moving_displacement_m: 1.0       # moving: at least this far first → last,
    fast_displacement_m: 0.5         # or at least this far...
    fast_speed_mps: 0.5              # ...at at least this average speed
    endpoint_frames: 3

  filter:                            # drop a track only if short AND weak
    min_frames: 5
    min_strong: 1

  stitch:                            # link chunk k's tracks to chunk k+1's
    max_centre_dist_m: 1.0           # centres this close at a shared instant agree
    min_agreement: 0.5               # share of the shorter track's span instants
    min_agreeing_frames: 3
