[project]
name = "wato-world-tracking"
version = "0.1.0"
description = "4D tracking with 3D Kalman filtering, masklet association, and DINOv2 ReID."
requires-python = ">=3.11"
dependencies = [
    "wato-world-common",
    "click>=8",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.scripts]
wato_tracking = "wato_tracking.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
